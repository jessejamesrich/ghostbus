# Self-contained tmux config for the Ghostty + tmux agent-bus experiment.
# Prefer the wrapper:
#   ghostbus start

# Keep pane navigation and scrolling usable by default.
# Tradeoff: tmux intercepts drag-select/copy; use Ctrl-b M to turn mouse off
# temporarily when native Ghostty selection matters more.
set -g mouse on
set -g history-limit 100000
setw -g mode-keys vi
set -g renumber-windows on
set -g status-interval 5

# Preserve modified keys such as Shift+Enter through tmux so Codex can use
# them for multiline input instead of seeing plain Enter.
set -s extended-keys always
set -s extended-keys-format csi-u
set -as terminal-features ',xterm-ghostty:extkeys'

# Let terminal escape sequences that apps wrap for tmux reach Ghostty.
# This is useful for OSC clipboard, hyperlinks, images, and similar features.
# Codex desktop notifications did not work reliably through tmux passthrough;
# desktop notifications usually need an out-of-band notifier instead.
set -g allow-passthrough on

# Keep pane/window identity visible while we test target addressing.
set -g pane-border-status top
set -g pane-border-format ' #{pane_title}  #{session_name}:#{window_index}.#{pane_index}  #{pane_current_command} '

# More readable pane borders in a dark terminal.
set -g pane-border-style fg=colour240
set -g pane-active-border-style fg=colour75

# Copy-mode clipboard behavior for macOS when using Ctrl-b [.
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'

# Slow mouse wheel scrolling in tmux copy/scroll mode. tmux's default is 5
# lines per wheel tick, which is too jumpy in small agent panes.
bind-key -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 2 scroll-up
bind-key -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 2 scroll-down

# Quick toggle if mouse scrolling is temporarily more important than native copy.
bind-key m set -g mouse on \; display-message 'tmux mouse: on'
bind-key M set -g mouse off \; display-message 'tmux mouse: off'
